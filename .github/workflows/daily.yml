name: refresh-and-deploy

on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存英雄 / 装备图标
        uses: actions/cache@v4
        with:
          path: public/icons
          key: icons-${{ github.run_id }}
          restore-keys: |
            icons-

      - name: 抓取最新版本出装并编译静态数据
        run: node refresh.mjs --concurrency 6

      - name: 打印数据版本
        run: cat public/api/meta.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
