<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LOLM 出装" />
    <meta name="description" content="英雄联盟手游最新版本出装与天赋查询，支持外号与拼音模糊搜索，每天自动更新。" />
    <title>LOLM 出装天赋 · 实时查询</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css?v=5" />
  </head>
  <body>
    <div class="bg-glow"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">LOLM</span>
        <span class="brand-sub">出装 · 天赋</span>
      </div>
      <div class="meta">
        <span class="pill" id="patchPill">版本 —</span>
        <span class="updated" id="updatedAt">加载中…</span>
        <button class="icon-btn" id="refreshBtn" title="立即更新">⟳</button>
      </div>
    </header>

    <main>
      <section class="search-wrap">
        <div class="search-box">
          <svg class="search-ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              d="M10.5 3a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15Zm10 18-5.2-5.2"
            />
          </svg>
          <input
            id="q"
            type="search"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="搜索英雄 / 外号 / 拼音，如：小火龙"
          />
          <button class="clear-btn" id="clearBtn" aria-label="清空" hidden>✕</button>
        </div>
        <div class="suggest" id="suggest" hidden></div>
      </section>

      <section id="home" class="home">
        <div class="home-head">
          <h2>按分路浏览</h2>
          <span class="muted">点击分路筛选英雄</span>
        </div>
        <div class="lane-tabs" id="laneTabs"></div>
        <div class="champ-grid" id="champGrid"></div>
      </section>

      <section id="detail" class="detail" hidden></section>
    </main>

    <footer>
      <p>
        数据来源：<a href="https://www.wildriftmeta.com/" target="_blank" rel="noopener">wildriftmeta.com</a>
        （<span id="dataDate">—</span> 数据）· 每日 <span id="refreshHour">06:00</span> 自动更新 ·
        本站仅作参考，实际以游戏内为准
      </p>
      <p class="install-line">
        安卓安装包：<a href="download/lolm.apk" download>下载 APK</a>
        （装一次即可，数据仍随站点每日更新）· iPhone / 安卓也可用浏览器「添加到主屏幕」
      </p>
    </footer>

    <script src="app.js?v=4"></script>
    <script>
      // PWA：注册 Service Worker（离线可用 + 装到手机主屏）
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
